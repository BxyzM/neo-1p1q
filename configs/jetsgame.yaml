seed: 'jetsgame_base'
random_seed: 42

# Data and outputs
dataset: 'jetsgame'
signal: 'Top'
background: 'QCD'
jetsgame_pt_bin: '500GeV'
jetsgame_level: 'truth'
n_signal: 10000
n_background: 10000
n_signal_val: 2000
n_background_val: 2000
n_signal_test: 20000
n_background_test: 20000
flat: false
norm_pt: true
# The directory on disk is spelled 'JetGame'; the dataset is JetsGame.
data_dir: '/ceph/mbinder/JetGame/data-v1.0.0'
save_dir: './saved_models'
dump: '/ceph/mbinder/Neo1P1Q/results'

# Circuit
wires: 10
num_layers: 1
shots: -1
backend: 'jax'
device_name: 'default.qubit'
diff_method: 'backprop'
circuit_type: 'normal'
operations_per_qubit: 3
aux_weights:
  scale_factor: 1.0
  bias: 0.1
  hamiltonian_coeffs: 0.1

# Optimization
batch_size: 100
epochs: 25
lr: 0.05
improv: 0.01
min_epochs: 3
decay_rate: 0.5
decay_patience: 2
loss: 'BCE'

# Run control
save: true
resume: false
desc: 'JetsGame training run'
